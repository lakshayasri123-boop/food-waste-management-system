            <p class="text-secondary">Fill in details for the food batch available for pickup.</p>
        </div>
        <div class="glass-card p-4 p-md-5">
            <form th:action="@{/donor/create-donation}" method="post">
                <div class="mb-3">
                    <label class="form-label text-light fw-medium">Food Name / Description</label>
                    <input type="text" name="foodName" class="form-control form-control-custom" placeholder="e.g. Fresh Buffet Cooked Rice & Curry" required>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label text-light fw-medium">Food Type</label>
                        <select name="foodType" class="form-select form-select-custom" required>
                            <option value="Prepared Meals">Prepared Meals</option>
                            <option value="Packaged Foods">Packaged Foods</option>
                            <option value="Bakery & Bread">Bakery & Bread</option>
                            <option value="Raw Produce / Vegetables">Raw Produce / Vegetables</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light fw-medium">Quantity</label>
                        <input type="text" name="quantity" class="form-control form-control-custom" placeholder="e.g. 50 Meals / 15 KG" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label text-light fw-medium">Expiry Timestamp</label>
                    <input type="datetime-local" name="expiryTime" class="form-control form-control-custom" required>
                </div>
<div class="mb-4">
                    <label class="form-label text-light fw-medium">Pickup Address</label>
                    <textarea name="pickupAddress" class="form-control form-control-custom" rows="3" placeholder="Exact address where NGO can pick up" required></textarea>
                </div>
                <button type="submit" class="btn btn-emerald w-100 py-3">
                    <i class="bi bi-check-lg me-2"></i> Publish Food Listing
                </button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
