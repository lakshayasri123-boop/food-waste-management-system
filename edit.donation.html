<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Donation - FoodWasteDonation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="py-5">
    <div class="container" style="max-width: 600px;">
        <div class="mb-4">
            <a href="/donor/dashboard" class="text-success text-decoration-none fw-bold">
                <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
            </a>
            <h2 class="text-white fw-bold mt-2">Edit Food Listing</h2>
            <p class="text-secondary">Update details for Donation #<span th:text="${donation.donationId}"></span></p>
        </div>
        <div class="glass-card p-4 p-md-5">
            <form th:action="@{'/donor/edit/' + ${donation.donationId}}" method="post">
                <div class="mb-3">
                    <label class="form-label text-light fw-medium">Food Name / Description</label>
                    <input type="text" name="foodName" th:value="${donation.foodName}" class="form-control form-control-custom" required>
                </div>
              <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label text-light fw-medium">Food Type</label>
                        <select name="foodType" class="form-select form-select-custom" required>
                            <option value="Prepared Meals" th:selected="${donation.foodType == 'Prepared Meals'}">Prepared Meals</option>
                            <option value="Packaged Foods" th:selected="${donation.foodType == 'Packaged Foods'}">Packaged Foods</option>
                            <option value="Bakery & Bread" th:selected="${donation.foodType == 'Bakery & Bread'}">Bakery & Bread</option>
                          <option value="Raw Produce / Vegetables" th:selected="${donation.foodType == 'Raw Produce / Vegetables'}">Raw Produce / Vegetables</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light fw-medium">Quantity</label>
                        <input type="text" name="quantity" th:value="${donation.quantity}" class="form-control form-control-custom" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label text-light fw-medium">Expiry Timestamp</label>
                    <input type="datetime-local" name="expiryTime" th:value="${donation.expiryTime}" class="form-control form-control-custom" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-light fw-medium">Pickup Address</label>
                    <textarea name="pickupAddress" th:text="${donation.pickupAddress}" class="form-control form-control-custom" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-emerald w-100 py-3">
                    <i class="bi bi-save me-2"></i> Save Changes
                </button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
