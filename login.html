<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FoodWasteDonation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center py-5">
    <div class="container" style="max-width: 450px;">
        <div class="text-center mb-4">
            <a href="/" class="brand-text text-decoration-none fs-2 fw-bold">
                <i class="bi bi-heart-pulse-fill text-success me-2"></i>FoodWasteDonation
            </a>
            <p class="text-secondary mt-1">Sign in to access your portal</p>
        </div>
          <!-- Flash messages -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="glass-card p-4 p-md-5">
            <form th:action="@{/login}" method="post">
                <div class="mb-4">
                    <label class="form-label text-light fw-medium">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control form-control-custom" placeholder="name@organization.com" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-light fw-medium">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control form-control-custom" placeholder="••••••••" required>
                    </div>
                </div>
                 <button type="submit" class="btn btn-emerald w-100 py-3 mb-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Log In
                </button>
                <div class="text-center">
                    <span class="text-secondary">Don't have an account? </span>
                    <a href="/register" class="text-success text-decoration-none fw-bold">Register here</a>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
